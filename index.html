<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI編集部｜AI指示文ライブラリ</title><style>
:root{--pink:#e985a6;--pink2:#f7c5d4;--brown:#493b38;--cream:#fffaf5;--line:#eee1dc;--mint:#dcefe6;--lav:#e9e1f4;--yellow:#f8edcf}*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;background:linear-gradient(180deg,#fffaf7,#fffdf9);color:var(--brown)}header{position:relative;text-align:center;padding:48px 18px 30px;background:radial-gradient(circle at 12% 25%,#f8dce6 0 7%,transparent 8%),radial-gradient(circle at 88% 20%,#e6f2eb 0 7%,transparent 8%),linear-gradient(135deg,#fff6f8,#fffaf2);border-bottom:1px solid #f1e3df;overflow:hidden}header:before,header:after{content:'♡';position:absolute;color:#e9a0b6;font-size:30px;transform:rotate(-12deg)}header:before{left:9%;top:28px}header:after{right:10%;bottom:22px}.kicker{display:inline-block;background:#fff;border:1px solid #eadbd6;border-radius:999px;padding:6px 12px;font-size:12px;letter-spacing:.12em}.logo{margin:10px 0 2px;font-family:"Hannotate SC","Klee","Yu Kyokasho","Hiragino Maru Gothic ProN",cursive;font-size:34px;line-height:1.25;letter-spacing:.06em;font-weight:700}.logo em{font-style:normal;color:var(--pink)}header p{margin:10px 0 0;color:#7b6e69;font-size:14px}.wrap{max-width:920px;margin:auto;padding:20px}.search{width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:20px;font-size:15px;background:#fff;box-shadow:0 6px 18px #7354410a;outline:none}.tabs{display:flex;gap:8px;overflow:auto;padding:16px 0 8px;scrollbar-width:none}.tab{position:relative;white-space:nowrap;border:1px solid #eadfda;background:#fff;border-radius:999px;padding:10px 15px;font-weight:700;color:#655955;cursor:pointer}.tab.active{background:var(--pink);border-color:var(--pink);color:#fff}.tab .dotnew{position:absolute;right:-3px;top:-8px;background:#f1a63c;color:#fff;border-radius:999px;padding:2px 6px;font-size:9px;box-shadow:0 2px 6px #0002}.sectionTitle{font-family:"Hannotate SC","Klee","Yu Kyokasho",cursive;font-size:22px;margin:20px 2px 13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 7px 20px #5b3d2e0b;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px #5b3d2e14}.card:after{content:'›';position:absolute;right:16px;top:50%;font-size:25px;color:#d4b8b0}.card h3{margin:10px 28px 5px 0;font-family:"Hannotate SC","Klee","Yu Kyokasho",cursive;font-size:18px;line-height:1.5}.card p{margin:0 22px 0 0;color:#786e6a;font-size:13px;line-height:1.6}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f9e5ec;color:#b45476;font-size:10px;font-weight:800;margin:0 4px 3px 0}.short{background:var(--lav);color:#70549a}.official{background:var(--mint);color:#367258}.new{background:#fff0d3;color:#a76812}.detail{display:none;position:fixed;inset:0;z-index:9;background:linear-gradient(180deg,#fff8f7,#fffdf9);overflow:auto}.detail.on{display:block}.inner{max-width:740px;margin:auto;padding:18px 20px 50px}.back{border:0;background:#fff;border-radius:50%;width:42px;height:42px;font-size:28px;box-shadow:0 4px 14px #0001;color:#5f504b}.inner h2{font-family:"Hannotate SC","Klee","Yu Kyokasho",cursive;font-size:28px;line-height:1.45}.prompt{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;line-height:1.8;font-size:14px;box-shadow:0 7px 20px #5b3d2e0b}.copy{width:100%;border:0;border-radius:18px;padding:16px;background:linear-gradient(90deg,#e985a6,#d96e99);color:#fff;font-weight:800;font-size:16px;margin:14px 0;box-shadow:0 6px 15px #d96e9933}.tip,.meta{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;line-height:1.7;margin-top:10px}.meta{font-size:12px;color:#706865}.meta a{color:#b44d75}.note{font-size:11px;color:#887d78;line-height:1.7;margin:25px 4px}.doodle{text-align:center;color:#dba0b2;letter-spacing:.5em;margin:12px 0 0}@media(max-width:620px){.logo{font-size:29px}.grid{grid-template-columns:1fr}.wrap{padding:15px}.card{padding:16px}}
</style></head><body><header><span class="kicker">PROMPT LIBRARY</span><div class="logo"><em>AI編集部</em><br>AI指示文ライブラリ</div><p>やりたいことを選ぶだけ。コピペで、すぐ使える。</p><div class="doodle">♡ ✎ ♡</div></header><main class="wrap"><input id="q" class="search" placeholder="🔎 やりたいことを検索（例：メール、資料、note）"><div id="tabs" class="tabs"></div><h2 class="sectionTitle">おすすめの指示文 <small id="count"></small></h2><div id="grid" class="grid"></div><p class="note">※ AI編集部 SHORTSはAI編集部独自のショート指示です。ChatGPTやClaudeの公式コマンドではありません。公式機能を掲載する場合は一次情報と確認日を明記します。</p></main><div id="detail" class="detail"><div class="inner"><button class="back" onclick="closeD()">‹</button><div id="body"></div></div></div><script>
const A=[
['仕事','社内向け説得力あるスライド構成を作る','企画や提案を、決裁者が判断しやすい構成に整理します。',`あなたはBtoB企業の経営企画・事業戦略コンサルタントです。\n\n以下の【提案内容】について、社内の意思決定者を説得するためのプレゼンテーション構成を作成してください。\n\n【提案内容】\nここに今回の企画や提案内容を入力\n\n【条件】\n・5〜6枚のスライド構成\n・現状→課題→解決策→期待される効果→実行ステップの順で整理\n・各スライドのタイトル、要点、図表のアイデアを示す\n・可能な限り定量的なデータや根拠を入れる\n・決裁者が判断すべきポイントを明確にする`,'【提案内容】だけ自分の内容に書き換えればOK。'],
['仕事','上司へのメールを丁寧に作る','メモを簡潔で判断しやすい上司向けメールにします。',`以下の内容を、上司に送るビジネスメールに整えてください。\n\n【元の内容】\nここにメモを貼る\n\n【条件】\n・結論を先にする\n・事実と自分の意見を分ける\n・必要な数字や期限を落とさない\n・何を確認・判断してほしいか明確にする\n・丁寧だが冗長にしない\n・件名案も1つ付ける`,'箇条書きのメモでもOK。'],
['仕事','部下への返信をやわらかく整える','指示は明確にしつつ、きつく見えない文章にします。',`以下の内容を部下への返信文にしてください。\n\n【伝えたいこと】\nここに内容を入力\n\n【条件】\n・必要に応じて感謝を入れる\n・判断や指示は曖昧にしない\n・上から目線になりすぎない\n・改善が必要なら理由も短く添える\n・社内メールとして自然な長さにする`,'伝えたいことをそのまま貼ればOK。'],
['仕事','会議内容を3行で要約する','結論・未決事項・次のアクションを抽出します。',`以下の会議メモを3つに整理してください。\n1. 結論・決まったこと\n2. 未決事項・確認が必要なこと\n3. 次のアクション（担当・期限があれば明記）\n\n【会議メモ】\nここに貼り付け\n\n推測で補完せず、確認できない事項は「確認できません」としてください。`,'会議メモや文字起こしを貼ります。'],
['仕事','判断に迷う案件を整理する','事実・不足情報・リスク・選択肢に分解します。',`以下の案件について、結論を急がず判断材料を整理してください。\n\n【案件】\nここに状況を入力\n\n【出力】\n①確認できる事実\n②私の意見・仮説\n③不足している情報\n④想定されるリスク\n⑤考えられる選択肢\n⑥各選択肢のメリット・デメリット\n⑦確認すべき質問\n⑧次に取るべき行動\n\n私の考えに迎合せず、論理的に弱い部分があれば指摘してください。`,'重要な判断前の整理用。'],
['子育て・学習','子どもの課題からレポート構成を作る','答えを代筆せず、自分で書ける構成を作ります。',`以下の学校課題について、子どもが自分で考えて書けるレポート構成を作ってください。\n\n【学年】ここに入力\n【課題】ここに入力\n\n答えを完成させるのではなく、見出し、考えるための質問、調べるポイント、まとめ方の例を示してください。学年に合った言葉を使ってください。`,'学年と課題を入れます。'],
['子育て・学習','教材から15分復習プリントを作る β','短時間で取り組める問題構成を作ります。',`以下の教材内容から、15分程度で解ける復習プリント案を作成してください。\n\n【教材内容】\nここに入力\n\n【条件】\n・今回の範囲を約8割、過去の復習を約2割\n・基礎→確認→少し考える問題の順\n・問題と解答を分ける\n・教材にない事実を勝手に追加しない\n・不足情報は確認できないと明記する`,'画像教材は読み取り精度を必ず確認してください。'],
['子育て・学習','教材からフラッシュカードを作る','教材の重要語句を、反復しやすい暗記カードにします。',`添付または入力した教材だけを使って、学習用フラッシュカードを作ってください。\n\n【条件】\n・教材に書かれている内容だけを使う\n・重要語句・定義・公式・間違えやすいポイントを優先する\n・1枚につき1つの問いにする\n・表面は短い質問、裏面は簡潔な答えにする\n・学年に合った言葉で書く\n・似た内容の重複は避ける\n・教材から確認できない内容は追加しない\n・まず20枚を目安に作る`,'教材やノートを添付して、この指示文を使います。ChatGPTのフラッシュカード機能を使える環境ではインタラクティブなカードとして学習できます。','official','2026-09-28'],
['副業・SNS','実体験からnote記事の下書きを作る','出来事や気づきを読みやすい記事にします。',`以下の実体験メモからnote記事の下書きを作ってください。\n\n【メモ】\nここに出来事・感想を入力\n\n【条件】\n・体験→気づき→読者が持ち帰れること、の流れ\n・体験していないことを創作しない\n・過度に成功談にしない\n・自然な一人称\n・タイトル案を5案\n・見出しを入れてスマホで読みやすくする`,'箇条書きでもOK。'],
['副業・SNS','今日の出来事からnoteネタを5本出す','日常の小さな気づきも記事候補にします。',`以下の今日の出来事から、noteの記事ネタを5つ提案してください。\n\n【今日の出来事】\nここに入力\n\n各案について「タイトル案」「読者が共感しそうなポイント」「記事の切り口」を示してください。無理に教訓化しないでください。`,'日記のようなメモから使えます。'],
['画像生成','記事からサムネ画像の指示文を作る','記事テーマを画像生成向けの具体的な指示にします。',`以下の記事内容をもとに、横長サムネイル画像を生成するための指示文を作ってください。\n\n【記事内容】\nここに貼る\n\n【条件】\n・主題が一目で伝わる\n・文字は短いタイトルのみ\n・スマホの小さい表示でも認識しやすい\n・人物、背景、小物、表情、余白、画角を具体的に指定\n・ありがちなAI画像になりすぎない工夫を1つ提案`,'記事本文を貼ります。'],
['日常・暮らし','複数候補を同じ条件で比較する','選択肢を同じ基準で比較し違いを見える化します。',`以下の候補を、私の条件に沿って比較してください。\n\n【候補】\nここに入力\n【重視する条件】\nここに入力\n\n比較軸を揃え、確認できる事実と評価を分けてください。不明な項目は推測せず「確認できません」としてください。`,'商品・サービス・旅行などに使えます。'],
['SHORTS','/easy10','10歳でも分かる説明に。',`10歳の子どもでも理解できる言葉で説明してください。難しい言葉は避け、必要な専門用語はその場で意味を説明し、身近な具体例を1つ入れてください。`,'AI編集部独自SHORTS。'],
['SHORTS','/gaps','不足情報・抜け漏れを洗い出す。',`現在の内容を確認し、判断・実行するうえで不足している情報、確認すべき事項、見落としている論点を洗い出してください。重要度の高い順に整理してください。`,'企画や提出物の確認に。'],
['SHORTS','/pushback','あえて反対側から検証する。',`私の意見に迎合せず、反対の立場からも検討してください。前提の弱い点、想定される反論、見落としているリスクを具体的に指摘し、必要なら改善案も示してください。`,'自分の案を厳しく検証したいときに。'],
['SHORTS','/facts','事実・推測・未確認を分ける。',`回答内容を「確認できる事実」「推測・仮定」「確認できないこと」に分けてください。確認できない内容を事実のように補完しないでください。`,'調査や重要判断に。'],
['SHORTS','/3ways','方向性の違う3案を出す。',`同じ方向性の言い換えではなく、考え方やアプローチが異なる3つの案を出してください。それぞれの特徴と向いている場面も一言で示してください。`,'アイデア出しに。'],
['SHORTS','/boss','上司・決裁者向けに整理する。',`上司・決裁者向けに、結論→理由→根拠となる数字・事実→判断してほしいこと、の順で簡潔に整理してください。`,'報告や説明のちょい足しに。']];
const C=['すべて','NEW','仕事','子育て・学習','副業・SNS','画像生成','日常・暮らし','SHORTS'];let c='すべて';const g=document.querySelector('#grid'),q=document.querySelector('#q'),ts=document.querySelector('#tabs');
function isNew(x){if(!x[6])return false;return (new Date()-new Date(x[6]+'T00:00:00+09:00'))/(864e5)<14}
function badges(x){let s=`<span class="badge ${x[0]==='SHORTS'?'short':''}">${x[0]==='SHORTS'?'⚡ AI編集部 SHORTS':x[0]}</span>`;if(x[5]==='official')s+='<span class="badge official">✓ ChatGPT公式機能</span>';if(isNew(x))s+='<span class="badge new">NEW</span>';return s}
function tabs(){ts.innerHTML=C.map(x=>`<button class="tab ${x===c?'active':''}" data-c="${x}">${x}${x==='NEW'&&A.some(isNew)?'<span class="dotnew">NEW</span>':''}</button>`).join('');ts.querySelectorAll('button').forEach(b=>b.onclick=()=>{c=b.dataset.c;tabs();render()})}
function render(){let s=q.value.toLowerCase(),r=A.filter(x=>(c==='すべて'||(c==='NEW'?isNew(x):x[0]===c))&&x.join(' ').toLowerCase().includes(s));count.textContent=r.length+'件';g.innerHTML=r.map(x=>`<article class="card" data-i="${A.indexOf(x)}">${badges(x)}<h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')||'<p>該当する指示文がありません。</p>';g.querySelectorAll('.card').forEach(e=>e.onclick=()=>openD(+e.dataset.i))}
function openD(i){let x=A[i],meta=x[5]==='official'?`<div class="meta"><b>区分：</b>ChatGPT公式機能を活用したAI編集部オリジナルテンプレート<br><b>一次情報：</b><a href="https://help.openai.com/en/articles/6825453-chatgpt-release-notes" target="_blank" rel="noopener">OpenAI ChatGPT Release Notes</a><br><b>確認日：</b>2026-09-28</div>`:'';body.innerHTML=`${badges(x)}<h2>${x[1]}</h2><p>${x[2]}</p>${meta}<h3>✨ この指示文をコピーして使う</h3><div class="prompt" id="pt"></div><button class="copy" onclick="cp()">📋 プロンプトをコピー</button><div class="tip"><b>✏️ 使い方</b><br>${x[4]}</div>`;pt.textContent=x[3];detail.classList.add('on');document.body.style.overflow='hidden'}function closeD(){detail.classList.remove('on');document.body.style.overflow=''}async function cp(){try{await navigator.clipboard.writeText(pt.textContent)}catch(e){}document.querySelector('.copy').textContent='✓ コピーしました'}q.oninput=render;tabs();render();
</script></body></html>
